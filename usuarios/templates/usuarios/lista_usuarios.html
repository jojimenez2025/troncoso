<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios registrados</title>
    <style>
        body {
            background-color: #e0f0ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #007acc;
            margin-bottom: 20px;
        }

        a.button {
            display: inline-block;
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        a.button:hover {
            background-color: #005f99;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #eef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Usuarios registrados</h1>

        <a href="{% url 'crear_usuario' %}" class="button">➕ Crear nuevo usuario</a>

        <table>
            <tr>
                <th>Usuario</th>
                <th>Rol</th>
            </tr>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.username }}</td>
                <td>{{ usuario.get_rol_display }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
