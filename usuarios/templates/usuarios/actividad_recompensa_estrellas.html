
{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="background-color:#f0f8ff; min-height:100vh;">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 text-center">

          <h2 class="mb-2" style="color:#004f8c; font-weight:700;">
            ⭐ Atrapa estrellas
          </h2>

          <p class="text-muted mb-3">
            Toca las estrellas que aparecen en la pantalla.
          </p>

          <div class="text-center my-3">
            <button type="button" id="btn-audio" class="btn btn-outline-primary rounded-pill px-4">
              🔊 Escuchar instrucción
            </button>
          </div>

          <div class="contador-box mb-3">
            Estrellas: <span id="contador">0</span> / 8
          </div>

          <div id="zona-juego">
            <div id="estrella">⭐</div>
          </div>

          <div id="mensaje" class="text-center mt-4 fw-bold"></div>

          <form id="form-recompensa" method="post">
            {% csrf_token %}
            <input type="hidden" name="completado" id="completado" value="0">
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'menu_actividades' %}" class="btn btn-link">
              ← Volver al menú de actividades
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .contador-box {
    display: inline-block;
    background: #ffffff;
    color: #004f8c;
    font-size: 24px;
    font-weight: bold;
    padding: 12px 24px;
    border-radius: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
  }

  #zona-juego {
    position: relative;
    width: 100%;
    height: 380px;
    background: linear-gradient(to bottom, #dff3ff, #ffffff);
    border: 4px solid #0077c8;
    border-radius: 28px;
    overflow: hidden;
    margin-top: 20px;
  }

  #estrella {
    position: absolute;
    font-size: 70px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s;
  }

  #estrella:hover {
    transform: scale(1.15);
  }

  .celebracion {
    font-size: 34px;
    color: #198754;
  }

  @media (max-width: 700px) {
    #zona-juego {
      height: 330px;
    }

    #estrella {
      font-size: 58px;
    }

    .contador-box {
      font-size: 20px;
    }
  }
</style>

<script>
  (function () {
    const estrella = document.getElementById("estrella");
    const zona = document.getElementById("zona-juego");
    const contador = document.getElementById("contador");
    const mensaje = document.getElementById("mensaje");
    const form = document.getElementById("form-recompensa");
    const completado = document.getElementById("completado");
    const btnAudio = document.getElementById("btn-audio");

    let puntos = 0;
    const meta = 8;
    let terminado = false;

    const textoAudio = "Toca las estrellas que aparecen en la pantalla.";

    function moverEstrella() {
      const zonaRect = zona.getBoundingClientRect();

      const maxX = zona.clientWidth - estrella.offsetWidth;
      const maxY = zona.clientHeight - estrella.offsetHeight;

      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);

      estrella.style.left = x + "px";
      estrella.style.top = y + "px";
    }

    btnAudio.addEventListener("click", function () {
      if ("speechSynthesis" in window) {
        const voz = new SpeechSynthesisUtterance(textoAudio);
        voz.lang = "es-MX";
        voz.rate = 0.85;
        voz.pitch = 1.2;

        const voces = window.speechSynthesis.getVoices();
        const vozFemenina = voces.find(v =>
          v.lang.startsWith("es") &&
          /female|mujer|paulina|monica|sabina|luciana|helena|elvira/i.test(v.name)
        );

        if (vozFemenina) {
          voz.voice = vozFemenina;
        }

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(voz);
      }
    });

    estrella.addEventListener("click", function () {
      if (terminado) return;

      puntos++;
      contador.textContent = puntos;

      mensaje.textContent = "⭐ ¡Muy bien!";
      mensaje.style.color = "#34c759";

      if (puntos >= meta) {
        terminado = true;
        estrella.style.display = "none";
        completado.value = "1";

        mensaje.innerHTML = "🎉 ¡Excelente! Terminaste el juego.";
        mensaje.classList.add("celebracion");

        setTimeout(() => {
          form.submit();
        }, 1500);

      } else {
        moverEstrella();
      }
    });

    moverEstrella();
  })();
</script>
{% endblock %}
