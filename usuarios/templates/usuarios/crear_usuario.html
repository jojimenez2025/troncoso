<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear nuevo usuario</title>
    <style>
        body {
            background-color: #e0f0ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #007acc;
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 15px;
        }

        form input, form select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005f99;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background-color: #ccc;
            color: black;
            padding: 8px 20px;
            border-radius: 10px;
        }

        .back-link:hover {
            background-color: #bbb;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>👤 Crear nuevo usuario</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>

        <a href="{% url 'lista_usuarios' %}" class="back-link">🔙 Volver</a>
    </div>
</body>
</html>
