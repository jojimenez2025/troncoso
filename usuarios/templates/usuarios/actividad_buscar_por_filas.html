
{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="background-color:#f0f8ff; min-height:100vh;">
  <div class="row justify-content-center">
    <div class="col-md-11 col-lg-10">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

          <h2 class="text-center mb-1" style="color:#004f8c; font-weight:700;">
            🔎 {{ titulo_actividad }}
          </h2>

          <p class="text-center text-muted mb-2">
            Nivel {{ nivel }}
          </p>

          <div class="text-center my-3">
            <button type="button" id="btn-audio" class="btn btn-outline-primary rounded-pill px-4">
              🔊 Escuchar instrucción
            </button>
          </div>

          <p class="text-center mb-4">
            {{ instruccion_texto }}
          </p>

          <div class="filas-juego">
            {% for fila in filas %}
            <div class="fila-ejercicio">

              <div class="modelo-fila" data-id="{{ fila.modelo.id }}">
                {{ fila.modelo.emoji }}
              </div>

              <div class="opciones-fila">
                {% for obj in fila.opciones %}
                <button type="button"
                        class="opcion-fila"
                        data-id="{{ obj.id }}"
                        data-modelo="{{ fila.modelo.id }}">
                  {{ obj.emoji }}
                </button>
                {% endfor %}
              </div>

            </div>
            {% endfor %}
          </div>

          <div id="mensaje" class="text-center mt-4 fw-bold"></div>

          <form id="form-filas" method="post" class="text-center mt-3">
            {% csrf_token %}
            <input type="hidden" name="completado" id="completado" value="0">
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'menu_actividades' %}" class="btn btn-link">
              ← Volver al menú de actividades
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .filas-juego {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .fila-ejercicio {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #ffffff;
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    border-left: 6px solid #0077c8;
  }

  .modelo-fila {
    width: 95px;
    height: 95px;
    min-width: 95px;
    border-radius: 20px;
    background: #eaf6ff;
    border: 4px solid #0077c8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 54px;
  }

  .opciones-fila {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .opcion-fila {
    width: 82px;
    height: 82px;
    border-radius: 18px;
    border: 4px solid transparent;
    background: #ffffff;
    box-shadow: 0 3px 9px rgba(0,0,0,0.12);
    font-size: 46px;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s, opacity 0.2s;
  }

  .opcion-fila:hover {
    transform: scale(1.05);
  }

  .opcion-fila.correcto {
    border-color: #34c759;
    background: #e9ffe9;
  }

  .opcion-fila.error {
    border-color: #ff3b30;
    background: #ffecec;
  }

  .opcion-fila.bloqueado {
    pointer-events: none;
    opacity: 0.75;
  }

  @media (max-width: 700px) {
    .fila-ejercicio {
      flex-direction: column;
    }

    .modelo-fila {
      width: 85px;
      height: 85px;
      min-width: 85px;
      font-size: 48px;
    }

    .opcion-fila {
      width: 72px;
      height: 72px;
      font-size: 40px;
    }
  }
</style>

<script>
  (function () {
    const opciones = document.querySelectorAll(".opcion-fila");
    const mensaje = document.getElementById("mensaje");
    const form = document.getElementById("form-filas");
    const completado = document.getElementById("completado");
    const btnAudio = document.getElementById("btn-audio");

    const totalCorrectos = Array.from(opciones).filter(opcion =>
      opcion.dataset.id === opcion.dataset.modelo
    ).length;

    let aciertos = 0;
    let enviado = false;

    const textoAudio = "{{ instruccion_texto|escapejs }}";

    btnAudio.addEventListener("click", function () {
      if ("speechSynthesis" in window) {
        const voz = new SpeechSynthesisUtterance(textoAudio);
        voz.lang = "es-MX";
        voz.rate = 0.85;
        voz.pitch = 1.2;

        const voces = window.speechSynthesis.getVoices();
        const vozFemenina = voces.find(v =>
          v.lang.startsWith("es") &&
          /female|mujer|paulina|monica|sabina|luciana|helena|elvira/i.test(v.name)
        );

        if (vozFemenina) {
          voz.voice = vozFemenina;
        }

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(voz);
      }
    });

    opciones.forEach(opcion => {
      opcion.addEventListener("click", function () {
        if (opcion.classList.contains("bloqueado")) return;

        const idOpcion = opcion.dataset.id;
        const idModelo = opcion.dataset.modelo;

        if (idOpcion === idModelo) {
          opcion.classList.add("correcto", "bloqueado");
          aciertos++;

          mensaje.textContent = "✅ Muy bien. Sigue buscando.";
          mensaje.style.color = "#34c759";

          revisarFinal();
        } else {
          opcion.classList.add("error");

          mensaje.textContent = "❌ Ese no es igual al modelo de su fila.";
          mensaje.style.color = "#ff3b30";

          setTimeout(() => {
            opcion.classList.remove("error");
          }, 700);
        }
      });
    });

    function revisarFinal() {
      if (aciertos === totalCorrectos && !enviado) {
        enviado = true;
        completado.value = "1";

        mensaje.textContent = "🎉 ¡Excelente! Terminaste este nivel.";
        mensaje.style.color = "#198754";

        setTimeout(() => {
          form.submit();
        }, 1200);
      }
    }
  })();
</script>
{% endblock %}
